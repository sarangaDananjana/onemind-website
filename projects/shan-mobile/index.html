<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shan Mobile — Project Details</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet" />
  
  <style>
    :root {
      --bg: #0C0C0E;
      --bg2: #111115;
      --white: #F4F4F5;
      --grey: #6B7280;
      --grey-light: #9CA3AF;
      --cobalt: #0047FF;
      --border: rgba(255, 255, 255, 0.07);
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Grid Background */
    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: -1;
    }

    /* Ambient Glow */
    .ambient-glow {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(0, 71, 255, 0.15) 0%, transparent 60%);
      filter: blur(60px);
      z-index: -1;
      pointer-events: none;
    }

    nav {
      width: 100%;
      padding: 32px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 20px;
      color: var(--white);
      text-decoration: none;
    }

    .back-btn {
      color: var(--grey-light);
      text-decoration: none;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--white);
    }

    .project-header {
      text-align: center;
      max-width: 900px;
      padding: 80px 24px;
      margin-top: 40px;
    }

    .project-badge {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--cobalt);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 24px;
      display: inline-block;
    }

    .project-title {
      font-family: var(--font-display);
      font-size: clamp(48px, 6vw, 96px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 32px;
      color: transparent;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.8);
      background: linear-gradient(90deg, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .project-desc {
      color: var(--grey-light);
      line-height: 1.8;
      font-size: 18px;
      font-weight: 300;
      max-width: 600px;
      margin: 0 auto 48px;
    }

    .content-area {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 48px 120px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }

    .placeholder-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: var(--grey);
      font-family: 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 12px;
      transition: border-color 0.3s;
    }

    .placeholder-box:hover {
      border-color: var(--cobalt);
    }
    
    .placeholder-box svg {
      margin-bottom: 16px;
      opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="grid-bg"></div>
  <div class="ambient-glow"></div>

  <nav>
    <a href="/" class="nav-logo">One Mind</a>
    <a href="/portfolio.html" class="back-btn">← Back to Portfolio</a>
  </nav>

  <header class="project-header">
    <span class="project-badge">Mobile Application</span>
    <h1 class="project-title">Shan Mobile</h1>
    <p class="project-desc">
      A completely custom web and mobile experience. You can drop your HTML files, images, and assets directly into this directory (<code>projects/shan-mobile/</code>).
    </p>
  </header>

  <main class="content-area">
    <div class="placeholder-box">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      Drop Hero Image Here
    </div>
  </main>

</body>
</html>
