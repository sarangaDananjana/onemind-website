<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shan Mobile — Project Details</title>
  
  <!-- Add your project-specific CSS links here -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&family=DM+Mono:wght@300;400&display=swap"
    rel="stylesheet" />
  
  <style>
    :root {
      --bg: #0C0C0E;
      --bg2: #111115;
      --white: #F4F4F5;
      --grey: #6B7280;
      --grey-light: #9CA3AF;
      --cobalt: #0047FF;
      --border: rgba(255, 255, 255, 0.07);
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .project-container {
      text-align: center;
      max-width: 800px;
      padding: 40px;
      border: 1px solid var(--border);
      background: var(--bg2);
    }

    .project-title {
      font-family: var(--font-display);
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 24px;
    }
    
    .project-desc {
      color: var(--grey-light);
      line-height: 1.8;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .btn-primary {
      background: var(--cobalt);
      color: var(--white);
      border: none;
      padding: 14px 28px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s, transform 0.2s;
    }

    .btn-primary:hover {
      background: #0038CC;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <!-- This is a placeholder for your project files (HTML, CSS, Images, Assets). -->
  <div class="project-container">
    <h1 class="project-title">Shan Mobile</h1>
    <p class="project-desc">
      Welcome to the Shan Mobile project directory. 
      This folder (<code>projects/shan-mobile/</code>) is mapped to <code>/shan-mobile/</code> via the Express server.
      You can add all the HTML files, images, and assets that you did for Shan Mobile into this folder.
    </p>
    <a href="/portfolio.html" class="btn-primary">Back to Portfolio</a>
  </div>
</body>

</html>
