<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Mind | Reimagine Experience</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0C0C0E;
            --bg-glass: rgba(12, 12, 14, 0.85);
            --white: #F4F4F5;
            --grey: #9CA3AF;
            --cobalt: #0047FF;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'DM Sans', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* Iframes Layering */
        .view-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: opacity 0.8s ease, filter 0.8s ease;
        }

        #old-site {
            z-index: 1;
        }

        #new-site {
            z-index: 2;
            opacity: 0;
            pointer-events: none;
            background: var(--bg);
        }

        /* Active States for Reveal */
        body.revealed #old-site {
            opacity: 0;
            pointer-events: none;
            filter: blur(10px);
        }

        body.revealed #new-site {
            opacity: 1;
            pointer-events: auto;
        }

        /* Overlay UI Controls */
        .controls-overlay {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 16px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            padding: 16px 24px;
            border-radius: 100px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: all 0.5s ease;
        }

        /* Top Bar Context */
        .context-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(12, 12, 14, 0.9) 0%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .context-text {
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            color: var(--white);
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* Buttons */
        .btn {
            background: var(--cobalt);
            color: var(--white);
            border: none;
            padding: 14px 28px;
            border-radius: 50px;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 71, 255, 0.3);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--grey);
            color: var(--white);
        }

        .btn-secondary:hover {
            border-color: var(--white);
            box-shadow: none;
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-success {
            background: #00D47E;
            color: #0C0C0E;
            font-weight: 600;
        }

        .btn-success:hover {
            background: #00FF98;
            box-shadow: 0 10px 20px rgba(0, 212, 126, 0.3);
        }

        /* State Management */
        .show-on-reveal {
            display: none !important;
        }

        body.revealed .hide-on-reveal {
            display: none !important;
        }

        body.revealed .show-on-reveal {
            display: flex !important;
        }

        /* Modal Form */
        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(12, 12, 14, 0.9);
            backdrop-filter: blur(10px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #111115;
            border: 1px solid var(--border);
            padding: 48px;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
            transform: translateY(20px);
            transition: 0.3s;
        }

        .modal-backdrop.active .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            margin-bottom: 12px;
        }

        .modal-desc {
            color: var(--grey);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-family: 'DM Mono', monospace;
            font-size: 10px;
            color: var(--grey);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--white);
            padding: 14px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: var(--cobalt);
        }

        /* Loader */
        .loader-screen {
            position: absolute;
            inset: 0;
            background: var(--bg);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--cobalt);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Loading Screen -->
    <div id="loader" class="loader-screen">
        <div class="spinner"></div>
        <div class="context-text">Loading One Mind Engine...</div>
    </div>

    <!-- Context Header -->
    <div class="context-bar">
        <div class="context-text">Viewing: <span id="client-name-display">Client Site</span></div>
    </div>

    <!-- Layers -->
    <iframe id="old-site" class="view-layer"></iframe>
    <iframe id="new-site" class="view-layer"></iframe>

    <!-- Floating Controls -->
    <div class="controls-overlay">
        <!-- State 1: Before -->
        <button class="btn hide-on-reveal" onclick="triggerReveal()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12h4l3-9 5 18 3-9h5" />
            </svg>
            View One Mind Reimagine
        </button>

        <!-- State 2: After -->
        <button class="btn btn-secondary show-on-reveal" onclick="resetReveal()">
            ← Original
        </button>
        <button class="btn btn-success show-on-reveal" onclick="openModal()">
            Yes, I'm In! Let's Talk 🚀
        </button>
    </div>

    <!-- Interest Form Modal -->
    <div class="modal-backdrop" id="interest-modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <h2 class="modal-title">Take the Leap</h2>
                <span style="font-size:24px; cursor:pointer; color:var(--grey)" onclick="closeModal()">&times;</span>
            </div>
            <p class="modal-desc">Love what you see? Leave your details below and a senior architect from One Mind will
                reach out to discuss making this a reality.</p>

            <form id="reply-form" onsubmit="submitInterest(event)">
                <div class="form-group">
                    <label class="form-label">Your Name</label>
                    <input type="text" id="reply-name" class="form-input" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="reply-phone" class="form-input" required placeholder="+1 234 567 8900">
                </div>
                <button type="submit" class="btn" id="reply-btn"
                    style="width:100%; justify-content:center; margin-top: 12px;">Submit Details</button>
            </form>
        </div>
    </div>

    <script>
        let currentSlug = window.location.pathname.split('/').pop();

        // Load Data
        async function initShowcase() {
            try {
                const res = await fetch(`/api/reimagine/${currentSlug}`);
                if (!res.ok) {
                    document.body.innerHTML = '<div style="display:flex; height:100vh; align-items:center; justify-content:center; font-family:Syne;"><h1>Showcase Not Found or Inactive</h1></div>';
                    return;
                }
                const data = await res.json();

                document.title = `One Mind Reimagine | ${data.clientName}`;
                document.getElementById('client-name-display').innerText = data.clientName;

                // Setup Old Site Iframe
                document.getElementById('old-site').src = data.oldUrl;

                // Setup New Site (Inject HTML)
                const newIframe = document.getElementById('new-site');
                const doc = newIframe.contentWindow.document;
                doc.open();

                // Ensure assets paths resolve correctly relative to root if they used absolute paths
                // Backend serves them at /reimagine-assets/slug/filename
                doc.write(data.reimaginedHtml);
                doc.close();

                // Hide Loader
                setTimeout(() => {
                    document.getElementById('loader').style.opacity = '0';
                    setTimeout(() => document.getElementById('loader').remove(), 500);
                }, 1000);

            } catch (err) {
                console.error("Failed to load showcase data", err);
            }
        }

        // UI Interactions
        function triggerReveal() {
            document.body.classList.add('revealed');
        }

        function resetReveal() {
            document.body.classList.remove('revealed');
        }

        function openModal() {
            document.getElementById('interest-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('interest-modal').classList.remove('active');
        }

        async function submitInterest(e) {
            e.preventDefault();
            const btn = document.getElementById('reply-btn');
            btn.innerText = 'Sending...';
            btn.disabled = true;

            const payload = {
                name: document.getElementById('reply-name').value,
                phone: document.getElementById('reply-phone').value
            };

            try {
                const res = await fetch(`/api/reimagine/${currentSlug}/reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    btn.style.background = '#00D47E';
                    btn.style.color = '#0C0C0E';
                    btn.innerText = 'Received! We will contact you soon.';
                    setTimeout(() => closeModal(), 3000);
                } else {
                    btn.innerText = 'Error. Please try again.';
                    btn.style.background = '#FF3B5C';
                }
            } catch (err) {
                btn.innerText = 'Network Error';
            }

            setTimeout(() => {
                btn.innerText = 'Submit Details';
                btn.disabled = false;
                btn.style.background = '';
                btn.style.color = '';
            }, 4000);
        }

        window.onload = initShowcase;
    </script>
</body>

</html>
